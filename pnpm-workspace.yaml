  "@tiptap/core": "3.17.0"
  "@tiptap/pm": "3.17.0"
  "@babel/core": "^7.29.6"
  "ajv@>=8.0.0 <9.0.0": "^8.18.0"
  "brace-expansion@>=2.0.0 <3.0.0": "^2.0.3"
  defu: "^6.1.5"
  fast-uri: "^3.1.2"
  form-data: "^4.0.6"
  "minimatch@>=9.0.0 <10.0.0": "^9.0.7"
  "markdown-it@>=14.0.0 <15.0.0": "^14.2.0"
  picomatch: "^4.0.4"
  "postcss@>=8.0.0 <9.0.0": "^8.5.10"
  protobufjs: "^7.6.4"
  rollup: "^4.59.0"
  shell-quote: "^1.8.4"
  "uuid@11.1.0": "11.1.1"
  "yaml@>=2.0.0 <3.0.0": "^2.8.3"
  "ws@>=8.0.0 <9.0.0": "^8.21.0"

onlyBuiltDependencies:
