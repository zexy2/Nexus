services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: postgres
    # Temporal is only used by web/worker on the private Compose network.
    # Do not publish 7233 on a public VPS.

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
        NEXT_PUBLIC_COLLABORATION_URL: ${NEXT_PUBLIC_COLLABORATION_URL:?NEXT_PUBLIC_COLLABORATION_URL is required}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
        NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED: ${NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED:-false}
        NEXT_PUBLIC_DEMO_ACCESS_CODE_REQUIRED: ${NEXT_PUBLIC_DEMO_ACCESS_CODE_REQUIRED:-false}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?AUTH_TRUSTED_ORIGINS is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      NEXT_PUBLIC_COLLABORATION_URL: ${NEXT_PUBLIC_COLLABORATION_URL:?NEXT_PUBLIC_COLLABORATION_URL is required}
      COLLABORATION_HEALTH_URL: ${COLLABORATION_HEALTH_URL:-http://collaboration:1234}
      COLLAB_AUTH_SECRET: ${COLLAB_AUTH_SECRET:?COLLAB_AUTH_SECRET is required}
      DEMO_MODE: ${DEMO_MODE:-true}
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:-}
      DEMO_SESSION_TTL_MINUTES: ${DEMO_SESSION_TTL_MINUTES:-60}
      DEMO_MAX_ACTIVE_SESSIONS: ${DEMO_MAX_ACTIVE_SESSIONS:-25}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
      NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED: ${NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED:-false}
      NEXT_PUBLIC_DEMO_ACCESS_CODE_REQUIRED: ${NEXT_PUBLIC_DEMO_ACCESS_CODE_REQUIRED:-false}
      AI_ENABLED: ${AI_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AI_WORKFLOWS_PER_DAY: ${AI_WORKFLOWS_PER_DAY:-25}
      AI_CHAT_MESSAGES_PER_DAY: ${AI_CHAT_MESSAGES_PER_DAY:-100}
      AI_GLOBAL_DAILY_LIMIT: ${AI_GLOBAL_DAILY_LIMIT:-40}
      AI_GLOBAL_PER_MINUTE_LIMIT: ${AI_GLOBAL_PER_MINUTE_LIMIT:-2}
      AI_USER_DAILY_LIMIT: ${AI_USER_DAILY_LIMIT:-6}
      AI_USER_PER_MINUTE_LIMIT: ${AI_USER_PER_MINUTE_LIMIT:-1}
      AI_WORKFLOW_DAILY_LIMIT: ${AI_WORKFLOW_DAILY_LIMIT:-2}
      AI_CHAT_DAILY_LIMIT: ${AI_CHAT_DAILY_LIMIT:-4}
      AI_DEMO_DAILY_LIMIT: ${AI_DEMO_DAILY_LIMIT:-12}
      AI_DEMO_PER_MINUTE_LIMIT: ${AI_DEMO_PER_MINUTE_LIMIT:-1}
      AI_DEMO_WORKFLOW_DAILY_LIMIT: ${AI_DEMO_WORKFLOW_DAILY_LIMIT:-4}
      AI_DEMO_CHAT_DAILY_LIMIT: ${AI_DEMO_CHAT_DAILY_LIMIT:-8}
      AI_ADMIN_DAILY_LIMIT: ${AI_ADMIN_DAILY_LIMIT:-50}
      AI_ADMIN_PER_MINUTE_LIMIT: ${AI_ADMIN_PER_MINUTE_LIMIT:-4}
      AI_ADMIN_WORKFLOW_DAILY_LIMIT: ${AI_ADMIN_WORKFLOW_DAILY_LIMIT:-20}
      AI_ADMIN_CHAT_DAILY_LIMIT: ${AI_ADMIN_CHAT_DAILY_LIMIT:-100}
      AI_MAX_STEPS_PER_WORKFLOW: ${AI_MAX_STEPS_PER_WORKFLOW:-5}
    ports:
      # The host reverse proxy is the only public entry point.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
        NEXT_PUBLIC_COLLABORATION_URL: ${NEXT_PUBLIC_COLLABORATION_URL:?NEXT_PUBLIC_COLLABORATION_URL is required}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
        NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED: ${NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "@nexus/workflows", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      AI_ENABLED: ${AI_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AI_MAX_STEPS_PER_WORKFLOW: ${AI_MAX_STEPS_PER_WORKFLOW:-5}

  collaboration:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
        NEXT_PUBLIC_COLLABORATION_URL: ${NEXT_PUBLIC_COLLABORATION_URL:?NEXT_PUBLIC_COLLABORATION_URL is required}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
        NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED: ${NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED:-false}
    restart: unless-stopped
    command: ["pnpm", "--filter", "@nexus/web", "collab"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      COLLABORATION_HOST: 0.0.0.0
      COLLABORATION_PORT: 1234
      YJS_SNAPSHOT_UPDATE_THRESHOLD: ${YJS_SNAPSHOT_UPDATE_THRESHOLD:-100}
      YJS_SNAPSHOT_INTERVAL_MS: ${YJS_SNAPSHOT_INTERVAL_MS:-30000}
      COLLAB_MAX_PAYLOAD_BYTES: ${COLLAB_MAX_PAYLOAD_BYTES:-1048576}
      # Must match the web service so issued tokens verify. The server refuses
      # to start without it.
      COLLAB_AUTH_SECRET: ${COLLAB_AUTH_SECRET:?COLLAB_AUTH_SECRET is required}
    ports:
      - "${COLLABORATION_BIND:-127.0.0.1}:${COLLABORATION_PORT:-1234}:1234"

  temporal-ui:
    image: temporalio/ui:latest
    profiles: ["ops"]
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${TEMPORAL_UI_BIND:-127.0.0.1}:${TEMPORAL_UI_PORT:-8080}:8080"

  jaeger:
    image: jaegertracing/all-in-one:1.54
    profiles: ["ops"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_BIND:-127.0.0.1}:${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_BIND:-127.0.0.1}:${OTEL_GRPC_PORT:-4317}:4317"
      - "${JAEGER_BIND:-127.0.0.1}:${OTEL_HTTP_PORT:-4318}:4318"

volumes:
  postgres_data:
