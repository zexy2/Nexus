x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Build arguments shared by every app target. They must be identical for all
# services so web/worker/collaboration/migrate reuse one `builder` stage.
# NEXT_PUBLIC_* values are inlined into the web client bundle at build time.
x-build-args: &build-args
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
  NEXT_PUBLIC_COLLABORATION_URL: ${NEXT_PUBLIC_COLLABORATION_URL:?NEXT_PUBLIC_COLLABORATION_URL is required}
  NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
  NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED: ${NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED:-false}
  NEXT_PUBLIC_DEMO_ACCESS_CODE_REQUIRED: ${NEXT_PUBLIC_DEMO_ACCESS_CODE_REQUIRED:-false}

# Images: `build` keeps local builds working (`docker compose build`), `image`
# names the result. The defaults reproduce the historical local names
# (nexus-web:latest, ...). For registry deploys set
#   NEXUS_IMAGE_PREFIX=ghcr.io/zexy2/nexus NEXUS_IMAGE_TAG=sha-abc1234
# and use `docker compose pull` + `up --no-build` (see scripts/deploy.sh).

services:
  postgres:
    logging: *default-logging
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    logging: *default-logging
    # Pinned: `latest` silently upgrades the server on a pull. auto-setup is
    # only published up to 1.29.x (Temporal deprecated it); moving to 1.30+
    # means temporalio/server + admin-tools schema setup. Compatible with
    # @temporalio/* 1.18 in packages/workflows.
    image: temporalio/auto-setup:1.29.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: postgres
    # Temporal is only used by web/worker on the private Compose network.
    # Do not publish 7233 on a public VPS.

  web:
    logging: *default-logging
    image: ${NEXUS_IMAGE_PREFIX:-nexus}-web:${NEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args: *build-args
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      NODE_ENV: production
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      REQUIRE_INTEGRATIONS_HEALTH: ${REQUIRE_INTEGRATIONS_HEALTH:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?AUTH_TRUSTED_ORIGINS is required}
      # Compose passes env explicitly: values in .env.production only reach
      # the container when they are listed here.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN:-}
      ONBOARDING_LAUNCH_AT: ${ONBOARDING_LAUNCH_AT:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      NEXT_PUBLIC_COLLABORATION_URL: ${NEXT_PUBLIC_COLLABORATION_URL:?NEXT_PUBLIC_COLLABORATION_URL is required}
      COLLABORATION_HEALTH_URL: ${COLLABORATION_HEALTH_URL:-http://collaboration:1234}
      COLLAB_AUTH_SECRET: ${COLLAB_AUTH_SECRET:?COLLAB_AUTH_SECRET is required}
      APP_URL: ${APP_URL:-${NEXT_PUBLIC_APP_URL}}
      INTEGRATION_TOKEN_ENCRYPTION_KEY: ${INTEGRATION_TOKEN_ENCRYPTION_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      LINEAR_REDIRECT_URI: ${LINEAR_REDIRECT_URI:-}
      LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:-}
      DEMO_SESSION_TTL_MINUTES: ${DEMO_SESSION_TTL_MINUTES:-60}
      DEMO_MAX_ACTIVE_SESSIONS: ${DEMO_MAX_ACTIVE_SESSIONS:-25}
      DEMO_SESSION_RATE_LIMIT_PER_MINUTE: ${DEMO_SESSION_RATE_LIMIT_PER_MINUTE:-}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
      NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED: ${NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED:-false}
      NEXT_PUBLIC_DEMO_ACCESS_CODE_REQUIRED: ${NEXT_PUBLIC_DEMO_ACCESS_CODE_REQUIRED:-false}
      AI_ENABLED: ${AI_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AI_WORKFLOWS_PER_DAY: ${AI_WORKFLOWS_PER_DAY:-}
      AI_CHAT_MESSAGES_PER_DAY: ${AI_CHAT_MESSAGES_PER_DAY:-}
      AI_GLOBAL_DAILY_LIMIT: ${AI_GLOBAL_DAILY_LIMIT:-}
      AI_GLOBAL_PER_MINUTE_LIMIT: ${AI_GLOBAL_PER_MINUTE_LIMIT:-}
      AI_USER_DAILY_LIMIT: ${AI_USER_DAILY_LIMIT:-}
      AI_USER_PER_MINUTE_LIMIT: ${AI_USER_PER_MINUTE_LIMIT:-}
      AI_WORKFLOW_DAILY_LIMIT: ${AI_WORKFLOW_DAILY_LIMIT:-}
      AI_CHAT_DAILY_LIMIT: ${AI_CHAT_DAILY_LIMIT:-}
      AI_DEMO_DAILY_LIMIT: ${AI_DEMO_DAILY_LIMIT:-}
      AI_DEMO_PER_MINUTE_LIMIT: ${AI_DEMO_PER_MINUTE_LIMIT:-}
      AI_DEMO_WORKFLOW_DAILY_LIMIT: ${AI_DEMO_WORKFLOW_DAILY_LIMIT:-}
      AI_DEMO_CHAT_DAILY_LIMIT: ${AI_DEMO_CHAT_DAILY_LIMIT:-}
      AI_ADMIN_DAILY_LIMIT: ${AI_ADMIN_DAILY_LIMIT:-}
      AI_ADMIN_PER_MINUTE_LIMIT: ${AI_ADMIN_PER_MINUTE_LIMIT:-}
      AI_ADMIN_WORKFLOW_DAILY_LIMIT: ${AI_ADMIN_WORKFLOW_DAILY_LIMIT:-}
      AI_ADMIN_CHAT_DAILY_LIMIT: ${AI_ADMIN_CHAT_DAILY_LIMIT:-}
      AI_MAX_STEPS_PER_WORKFLOW: ${AI_MAX_STEPS_PER_WORKFLOW:-}
      CSP_ENFORCE: ${CSP_ENFORCE:-}
      REQUIRE_INTEGRATION_PROVIDERS: ${REQUIRE_INTEGRATION_PROVIDERS:-}
    ports:
      # The host reverse proxy is the only public entry point.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    logging: *default-logging
    image: ${NEXUS_IMAGE_PREFIX:-nexus}-worker:${NEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args: *build-args
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
    # Image CMD: node dist/worker.js (precompiled; no tsx/pnpm at runtime).
    # SIGTERM drains the worker; in-flight activities get WORKER_SHUTDOWN_GRACE_TIME
    # to finish, so the container stop timeout must be longer than that.
    stop_grace_period: 60s
    # The worker serves no HTTP. Its liveness is reported through the worker
    # heartbeat in /api/health.
    healthcheck:
      disable: true
    environment:
      WORKER_SHUTDOWN_GRACE_TIME: ${WORKER_SHUTDOWN_GRACE_TIME:-45 seconds}
      NODE_ENV: production
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      INTEGRATION_TOKEN_ENCRYPTION_KEY: ${INTEGRATION_TOKEN_ENCRYPTION_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AI_MAX_STEPS_PER_WORKFLOW: ${AI_MAX_STEPS_PER_WORKFLOW:-}

  collaboration:
    logging: *default-logging
    image: ${NEXUS_IMAGE_PREFIX:-nexus}-collaboration:${NEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: collaboration
      args: *build-args
    restart: unless-stopped
    # Image CMD: node dist-collab/collaboration.mjs (one esbuild bundle).
    # The collaboration server answers any HTTP GET on its port with 200 when
    # Postgres persistence is active.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:1234').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      COLLABORATION_HOST: 0.0.0.0
      COLLABORATION_PORT: 1234
      YJS_SNAPSHOT_UPDATE_THRESHOLD: ${YJS_SNAPSHOT_UPDATE_THRESHOLD:-100}
      YJS_SNAPSHOT_INTERVAL_MS: ${YJS_SNAPSHOT_INTERVAL_MS:-30000}
      COLLAB_MAX_PAYLOAD_BYTES: ${COLLAB_MAX_PAYLOAD_BYTES:-1048576}
      # Must match the web service so issued tokens verify. The server refuses
      # to start without it.
      COLLAB_AUTH_SECRET: ${COLLAB_AUTH_SECRET:?COLLAB_AUTH_SECRET is required}
    ports:
      - "${COLLABORATION_BIND:-127.0.0.1}:${COLLABORATION_PORT:-1234}:1234"

  # One-shot migration runner (drizzle-kit + guarded baseline). Not started by
  # `up`; run it explicitly before rolling out new app code:
  #   docker compose --env-file .env.production -f docker-compose.prod.yml run --rm migrate
  migrate:
    logging: *default-logging
    image: ${NEXUS_IMAGE_PREFIX:-nexus}-migrate:${NEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
      args: *build-args
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}

  temporal-ui:
    logging: *default-logging
    image: temporalio/ui:2.58.1
    profiles: ["ops"]
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${TEMPORAL_UI_BIND:-127.0.0.1}:${TEMPORAL_UI_PORT:-8080}:8080"

  jaeger:
    logging: *default-logging
    image: jaegertracing/all-in-one:1.54
    profiles: ["ops"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_BIND:-127.0.0.1}:${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_BIND:-127.0.0.1}:${OTEL_GRPC_PORT:-4317}:4317"
      - "${JAEGER_BIND:-127.0.0.1}:${OTEL_HTTP_PORT:-4318}:4318"

volumes:
  postgres_data:
