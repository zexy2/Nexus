name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Manual run on main re-runs the checks and republishes the images.
  workflow_dispatch:

# Default token scope for every job; only `publish` adds packages: write.
permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # shellcheck ships with the ubuntu runner image.
      - name: Shellcheck deploy script
        run: shellcheck -x scripts/deploy.sh

  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs every package's vitest suite with v8 coverage (text + lcov +
      # json-summary). No thresholds yet; numbers are reported only.
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const reports = [
            ["@nexus/web", "apps/web/coverage/coverage-summary.json"],
            ["@nexus/workflows", "packages/workflows/coverage/coverage-summary.json"],
          ];
          const pct = (m) => `${m.pct}% (${m.covered}/${m.total})`;
          console.log("### Test coverage\n");
          console.log("| Package | Lines | Branches | Functions | Statements |");
          console.log("| --- | --- | --- | --- | --- |");
          for (const [name, file] of reports) {
            if (!fs.existsSync(file)) {
              console.log(`| ${name} | n/a | n/a | n/a | n/a |`);
              continue;
            }
            const t = JSON.parse(fs.readFileSync(file, "utf8")).total;
            console.log(`| ${name} | ${pct(t.lines)} | ${pct(t.branches)} | ${pct(t.functions)} | ${pct(t.statements)} |`);
          }
          NODE

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            apps/web/coverage/
            packages/workflows/coverage/
          retention-days: 14
          if-no-files-found: warn

  docker:
    name: Docker images (linux/arm64)
    # Production runs on an ARM64 host, so the images are built natively on
    # GitHub's arm64 runner (free for public repos, much faster than QEMU).
    # All four targets (web, worker, collaboration, migrate) are built in one
    # bake from the multi-target Dockerfile, then each is started for real
    # against Postgres (pgvector) and Temporal. Nothing is pushed here.
    runs-on: ubuntu-24.04-arm
    needs: [lint, typecheck]
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      COLLAB_AUTH_SECRET: nexus-ci-collab-secret-at-least-32-characters
      SMOKE_DOC_ID: 00000000-0000-4000-8000-0000000000d1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The `job` context is not available in job-level env.
      - name: Export service container network
        env:
          SERVICE_NET: ${{ job.services.postgres.network }}
          SERVICE_PG_ID: ${{ job.services.postgres.id }}
        run: |
          echo "NET=$SERVICE_NET" >> "$GITHUB_ENV"
          echo "PG_ID=$SERVICE_PG_ID" >> "$GITHUB_ENV"

      # Temporal needs ~30s to create its schema; start it before the build so
      # it is ready by the time the worker and web smoke tests run.
      - name: Start Temporal (same image as production)
        run: |
          docker run -d --name temporal --network "$NET" \
            -e DB=postgres12 -e DB_PORT=5432 -e POSTGRES_USER=nexus \
            -e POSTGRES_PWD=nexus -e POSTGRES_SEEDS=postgres \
            temporalio/auto-setup:1.29.7 < /dev/null

      - name: Build images
        uses: docker/bake-action@v7
        env:
          TAGS: ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_COLLABORATION_URL: ws://localhost:1234
        with:
          files: docker-bake.hcl
          load: true
          set: |
            *.platform=linux/arm64
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max
            worker.cache-from=type=gha,scope=worker
            worker.cache-to=type=gha,scope=worker,mode=max
            collaboration.cache-from=type=gha,scope=collaboration
            collaboration.cache-to=type=gha,scope=collaboration,mode=max
            migrate.cache-from=type=gha,scope=migrate
            migrate.cache-to=type=gha,scope=migrate,mode=max

      - name: Image sizes
        run: |
          set -euo pipefail
          {
            echo "### Docker image sizes (linux/arm64)"
            echo
            echo "| Image | Size |"
            echo "| --- | --- |"
            for t in web worker collaboration migrate; do
              bytes=$(docker image inspect "nexus-$t:ci" --format '{{.Size}}')
              echo "| nexus-$t | $(numfmt --to=iec --suffix=B "$bytes") ($bytes bytes) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Smoke: all images run as the unprivileged node user on Node 24 arm64"
        run: |
          set -euo pipefail
          for t in web worker collaboration migrate; do
            out=$(docker run --rm --entrypoint node "nexus-$t:ci" -e 'console.log(require("os").userInfo().username, process.version, process.arch)' < /dev/null)
            echo "nexus-$t: $out"
            case "$out" in "node v24."*" arm64") ;; *) echo "unexpected runtime for nexus-$t"; exit 1 ;; esac
          done

      - name: "Smoke: migrate (fresh database, then a no-op second run)"
        run: |
          set -euo pipefail
          expected=$(ls packages/database/drizzle/*.sql | wc -l)
          count() { docker exec "$PG_ID" psql -U nexus -d nexus -Atc 'select count(*) from drizzle.__drizzle_migrations'; }
          docker run --rm --network "$NET" -e DATABASE_URL nexus-migrate:ci < /dev/null
          first=$(count)
          echo "applied after first run: $first (expected $expected)"
          test "$first" -eq "$expected"
          docker run --rm --network "$NET" -e DATABASE_URL nexus-migrate:ci < /dev/null
          second=$(count)
          echo "applied after second run: $second"
          test "$second" -eq "$first"
          # Seed one document for the collaboration websocket smoke test.
          docker exec -i "$PG_ID" psql -v ON_ERROR_STOP=1 -U nexus -d nexus <<SQL
          insert into users (id, name, email) values ('ci-smoke', 'CI smoke', 'ci-smoke@example.invalid');
          insert into workspaces (id, name, owner_id) values ('00000000-0000-4000-8000-0000000000a1', 'CI smoke', 'ci-smoke');
          insert into docs (id, workspace_id) values ('$SMOKE_DOC_ID', '00000000-0000-4000-8000-0000000000a1');
          SQL

      - name: "Smoke: worker connects to Temporal and bundles workflows"
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if docker exec temporal sh -c 'temporal operator namespace describe -n default --address temporal:7233 || tctl --address temporal:7233 --ns default namespace describe' > /dev/null 2>&1; then
              echo "temporal ready after ~$((i * 3))s"; break
            fi
            if [ "$i" -eq 60 ]; then docker logs --tail 50 temporal; exit 1; fi
            sleep 3
          done
          docker run -d --name worker --network "$NET" \
            -e DATABASE_URL -e TEMPORAL_ADDRESS=temporal:7233 -e NODE_ENV=production \
            nexus-worker:ci < /dev/null
          for i in $(seq 1 60); do
            if docker logs worker 2>&1 | grep -q "Waiting for workflows"; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' worker)" != "true" ] || [ "$i" -eq 60 ]; then
              docker logs worker; exit 1
            fi
            sleep 2
          done
          docker logs worker 2>&1 | grep -E "Workflow bundle created|Worker connected|Task Queue"
          docker logs worker 2>&1 | grep -q "Workflow bundle created"

      - name: "Smoke: collaboration serves HTTP and authorised Yjs websockets"
        run: |
          set -euo pipefail
          docker run -d --name collab --network "$NET" \
            -e DATABASE_URL -e COLLAB_AUTH_SECRET \
            -e COLLABORATION_HOST=0.0.0.0 -e COLLABORATION_PORT=1234 \
            nexus-collaboration:ci < /dev/null
          for i in $(seq 1 30); do
            if body=$(docker run --rm --network "$NET" --entrypoint node nexus-collaboration:ci \
                -e 'fetch("http://collab:1234").then(async r=>{const t=await r.text(); console.log(r.status, t); process.exit(r.ok?0:1)}).catch(()=>process.exit(1))' < /dev/null); then
              echo "$body"; break
            fi
            if [ "$i" -eq 30 ]; then docker logs collab; exit 1; fi
            sleep 1
          done
          echo "$body" | grep -q '"persistence":"postgres"'
          docker run --rm --network "$NET" -v "$PWD/scripts/ci:/ci:ro" \
            -e COLLAB_URL=ws://collab:1234 -e COLLAB_AUTH_SECRET -e DOC_ID="$SMOKE_DOC_ID" \
            --entrypoint node nexus-collaboration:ci /ci/collab-ws-smoke.mjs < /dev/null \
            || { docker logs collab; exit 1; }

      - name: "Smoke: web standalone server"
        env:
          # Throwaway value for this job's container only.
          HEALTH_CHECK_TOKEN: nexus-ci-health-check-value
        run: |
          set -euo pipefail
          printf 'x-health-token: %s\n' "$HEALTH_CHECK_TOKEN" > /tmp/health-headers
          docker run -d --name web --network "$NET" -p 3000:3000 \
            -e DATABASE_URL -e COLLAB_AUTH_SECRET \
            -e TEMPORAL_ADDRESS=temporal:7233 -e TEMPORAL_NAMESPACE=default \
            -e BETTER_AUTH_SECRET=nexus-ci-web-secret-at-least-32-characters \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e AUTH_TRUSTED_ORIGINS=http://localhost:3000 \
            -e COLLABORATION_HEALTH_URL=http://collab:1234 \
            -e HEALTH_CHECK_TOKEN \
            -e APP_COMMIT_SHA="$GITHUB_SHA" \
            -e OTEL_ENABLED=true \
            nexus-web:ci < /dev/null
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' -H @/tmp/health-headers http://127.0.0.1:3000/api/health || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then break; fi
            if [ "$i" -eq 60 ]; then docker logs web; exit 1; fi
            sleep 2
          done
          echo "/api/health -> $code"; cat /tmp/health.json; echo
          # Every dependency the image talks to must be reachable from it.
          for svc in database temporal collaboration worker; do
            status=$(jq -r ".services.$svc.status" /tmp/health.json)
            echo "$svc: $status"
            test "$status" = "healthy" || { docker logs web; exit 1; }
          done
          for path in / /login /register /icon.svg; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path -> $c"; test "$c" = "200"
          done
          css=$(curl -s http://127.0.0.1:3000/login | grep -oE '/_next/static/[^"]+\.css' | head -1)
          c=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$css")
          echo "$css -> $c"; test "$c" = "200"
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:3000/api/auth/sign-in/email)
          echo "POST /api/auth/sign-in/email (empty body) -> $c"; case "$c" in 4??) ;; *) docker logs web; exit 1 ;; esac
          echo "--- sharp (image optimisation) loads from the traced output"
          docker exec web node -e 'const p=require.resolve("next/dist/server/image-optimizer",{paths:["/app/apps/web"]}); require(require.resolve("sharp",{paths:[p]}))({create:{width:2,height:2,channels:3,background:"#000"}}).png().toBuffer().then(b=>console.log("sharp ok", b.length))'
          echo "--- container log"
          docker logs web 2>&1 | tail -20
          if docker logs web 2>&1 | grep -E "Cannot find module|MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND"; then exit 1; fi

      - name: Container logs on failure
        if: failure()
        run: |
          for c in temporal worker collab web; do
            echo "::group::$c"; docker logs --tail 200 "$c" 2>&1 || true; echo "::endgroup::"
          done

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: [build]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus
      BETTER_AUTH_SECRET: nexus-ci-e2e-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
      PUBLIC_SIGNUP_ENABLED: "false"
      NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED: "false"
      AI_ENABLED: "false"
      DEMO_MAX_ACTIVE_SESSIONS: "10"
      DEMO_SESSION_TTL_MINUTES: "15"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Install Playwright browsers
        run: pnpm --filter @nexus/web exec playwright install chromium

      - name: Run E2E tests
        run: pnpm --filter @nexus/web exec playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  publish:
    name: Publish images (GHCR)
    # Runs only for main (push or manual dispatch) and only after every other
    # CI job, including the image smoke tests, has passed.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [lint, typecheck, build, test, docker, e2e]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-images-main
      cancel-in-progress: false
    env:
      IMAGE_PREFIX: ghcr.io/zexy2/nexus
      # Inlined into the browser bundle at build time, so they must be the
      # production values. Override with repository variables; scripts/deploy.sh
      # refuses images whose values differ from the server's .env.production.
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://nexus.zekiakgul.dev' }}
      NEXT_PUBLIC_COLLABORATION_URL: ${{ vars.NEXT_PUBLIC_COLLABORATION_URL || 'wss://nexus.zekiakgul.dev/collab' }}
      NEXT_PUBLIC_DEMO_MODE: ${{ vars.NEXT_PUBLIC_DEMO_MODE || 'true' }}
      NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED: ${{ vars.NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED || 'false' }}
      NEXT_PUBLIC_DEMO_ACCESS_CODE_REQUIRED: ${{ vars.NEXT_PUBLIC_DEMO_ACCESS_CODE_REQUIRED || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image tags
        id: meta
        run: |
          short="${GITHUB_SHA::7}"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "TAGS=main,sha-$short" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          push: true
          provenance: false
          set: |
            *.platform=linux/arm64
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            web.cache-from=type=gha,scope=publish-web
            web.cache-to=type=gha,scope=publish-web,mode=max
            worker.cache-from=type=gha,scope=publish-worker
            worker.cache-to=type=gha,scope=publish-worker,mode=max
            collaboration.cache-from=type=gha,scope=publish-collaboration
            collaboration.cache-to=type=gha,scope=publish-collaboration,mode=max
            migrate.cache-from=type=gha,scope=publish-migrate
            migrate.cache-to=type=gha,scope=publish-migrate,mode=max

      - name: Published images
        env:
          SHORT: ${{ steps.meta.outputs.short }}
        run: |
          set -euo pipefail
          {
            echo "### Published to GHCR (linux/arm64)"
            echo
            echo "Deploy on the server: \`scripts/deploy.sh sha-$SHORT\` (or \`scripts/deploy.sh\` for \`main\`)."
            echo
            echo "| Image | Tags | Compressed size |"
            echo "| --- | --- | --- |"
            for t in web worker collaboration migrate; do
              ref="$IMAGE_PREFIX-$t:sha-$SHORT"
              bytes=$(docker buildx imagetools inspect --raw "$ref" | jq '[.layers[].size] | add')
              echo "| \`$IMAGE_PREFIX-$t\` | \`main\`, \`sha-$SHORT\` | $(numfmt --to=iec --suffix=B "$bytes") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
