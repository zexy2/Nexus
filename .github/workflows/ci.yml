name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs every package's vitest suite with v8 coverage (text + lcov +
      # json-summary). No thresholds yet; numbers are reported only.
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const reports = [
            ["@nexus/web", "apps/web/coverage/coverage-summary.json"],
            ["@nexus/workflows", "packages/workflows/coverage/coverage-summary.json"],
          ];
          const pct = (m) => `${m.pct}% (${m.covered}/${m.total})`;
          console.log("### Test coverage\n");
          console.log("| Package | Lines | Branches | Functions | Statements |");
          console.log("| --- | --- | --- | --- | --- |");
          for (const [name, file] of reports) {
            if (!fs.existsSync(file)) {
              console.log(`| ${name} | n/a | n/a | n/a | n/a |`);
              continue;
            }
            const t = JSON.parse(fs.readFileSync(file, "utf8")).total;
            console.log(`| ${name} | ${pct(t.lines)} | ${pct(t.branches)} | ${pct(t.functions)} | ${pct(t.statements)} |`);
          }
          NODE

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            apps/web/coverage/
            packages/workflows/coverage/
          retention-days: 14
          if-no-files-found: warn

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: [build]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus
      BETTER_AUTH_SECRET: nexus-ci-e2e-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
      PUBLIC_SIGNUP_ENABLED: "false"
      NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED: "false"
      AI_ENABLED: "false"
      DEMO_MAX_ACTIVE_SESSIONS: "10"
      DEMO_SESSION_TTL_MINUTES: "15"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Install Playwright browsers
        run: pnpm --filter @nexus/web exec playwright install chromium

      - name: Run E2E tests
        run: pnpm --filter @nexus/web exec playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
