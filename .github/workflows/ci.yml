name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs every package's vitest suite with v8 coverage (text + lcov +
      # json-summary). No thresholds yet; numbers are reported only.
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const reports = [
            ["@nexus/web", "apps/web/coverage/coverage-summary.json"],
            ["@nexus/workflows", "packages/workflows/coverage/coverage-summary.json"],
          ];
          const pct = (m) => `${m.pct}% (${m.covered}/${m.total})`;
          console.log("### Test coverage\n");
          console.log("| Package | Lines | Branches | Functions | Statements |");
          console.log("| --- | --- | --- | --- | --- |");
          for (const [name, file] of reports) {
            if (!fs.existsSync(file)) {
              console.log(`| ${name} | n/a | n/a | n/a | n/a |`);
              continue;
            }
            const t = JSON.parse(fs.readFileSync(file, "utf8")).total;
            console.log(`| ${name} | ${pct(t.lines)} | ${pct(t.branches)} | ${pct(t.functions)} | ${pct(t.statements)} |`);
          }
          NODE

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            apps/web/coverage/
            packages/workflows/coverage/
          retention-days: 14
          if-no-files-found: warn

  docker:
    name: Docker image (linux/arm64)
    # Production runs on an ARM64 host, so the image is built natively on
    # GitHub's arm64 runner (free for public repos, much faster than QEMU).
    # web, worker and collaboration all build this same Dockerfile and final
    # stage and differ only in CMD, so one build plus per-service smoke checks
    # covers all three. Nothing is pushed to a registry.
    runs-on: ubuntu-24.04-arm
    needs: [lint, typecheck]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: nexus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_COLLABORATION_URL=ws://localhost:1234

      - name: Smoke-check runtime image
        run: |
          set -euo pipefail
          echo "--- base: Node 24, corepack and pnpm as the unprivileged node user"
          docker run --rm nexus:ci sh -c 'id -un && node --version && corepack --version && pnpm --version'
          docker run --rm nexus:ci node -e 'if (process.versions.node.split(".")[0] !== "24") { console.error("expected Node 24, got " + process.version); process.exit(1) }'
          echo "--- web: Next.js production build present"
          docker run --rm -w /app/apps/web nexus:ci sh -c 'test -f .next/BUILD_ID && cat .next/BUILD_ID'
          echo "--- worker: Temporal native core-bridge loads"
          docker run --rm -w /app/packages/workflows nexus:ci node -e 'const w = require("@temporalio/worker"); if (typeof w.NativeConnection !== "function") process.exit(1); console.log("temporal worker ok", process.platform, process.arch)'
          echo "--- collaboration: tsx entrypoint resolves"
          docker run --rm -w /app/apps/web nexus:ci sh -c 'test -f src/server/collaboration.ts && pnpm exec tsx --version'

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: [build]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus
      BETTER_AUTH_SECRET: nexus-ci-e2e-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
      PUBLIC_SIGNUP_ENABLED: "false"
      NEXT_PUBLIC_PUBLIC_SIGNUP_ENABLED: "false"
      AI_ENABLED: "false"
      DEMO_MAX_ACTIVE_SESSIONS: "10"
      DEMO_SESSION_TTL_MINUTES: "15"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Install Playwright browsers
        run: pnpm --filter @nexus/web exec playwright install chromium

      - name: Run E2E tests
        run: pnpm --filter @nexus/web exec playwright test --project=chromium --repeat-each=4 --retries=0

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
